dependencies:
  - base
  - bytestring
  - containers
  - lens
  - lmdb-simple
  - process
  - PyF
  - tagsoup
  - text
  - unliftio
  - split

default-extensions:
  - BlockArguments
  - DataKinds
  - LambdaCase
  - OverloadedStrings
  - QuasiQuotes
  - TypeApplications
  - TypeOperators
  - TemplateHaskell
  - ViewPatterns

executable:
    ghc-options:
      - -threaded -rtsopts "-with-rtsopts=-N"
    main:
      hoverdb.hs
