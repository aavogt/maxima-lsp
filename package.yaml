name: maxima-lsp

dependencies:
  - base
  - lens
  - lens-regex-pcre
  - pcre-light
  - regex-applicative
  - text
  - aeson
  - vector
  - template-haskell
  - lens-aeson
  - aeson-qq
  - bytestring
  - unix
  - containers
  - transformers
  - process
  - lmdb-simple
  - directory
  - split
  - unliftio
  - pretty-simple
  - PyF
  - zippers

default-extensions:
  - ApplicativeDo
  - BlockArguments
  - DataKinds
  - DeriveGeneric
  - DuplicateRecordFields
  - FlexibleContexts
  - FlexibleInstances
  - LambdaCase
  - OverloadedStrings
  - QuasiQuotes
  - NamedFieldPuns
  - RecordWildCards
  - ScopedTypeVariables
  - TemplateHaskell
  - TypeApplications
  - TypeOperators
  - ViewPatterns
  - PatternSynonyms

source-dirs: .


data-files: hoverdb/hoverdb.lmdb*

executables:
  maxima-lsp:
    source-dirs: src
    main:
      main.hs

